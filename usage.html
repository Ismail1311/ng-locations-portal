<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Usage - NG Locations API</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg-main: #f8fafc; --bg-white: #ffffff; --text-main: #0f172a; --text-muted: #475569; --primary: #4f46e5; --border-color: #e2e8f0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); }
    a { text-decoration: none; color: inherit; }
    
    .header { background: var(--bg-white); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 50; }
    .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; height: 70px; display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.25rem; color: var(--text-main); }
    .logo-icon { background: var(--primary); color: white; padding: 6px; border-radius: 8px; display: flex; }
    
    .layout-wrapper { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 20px; }
    @media(min-width: 800px) { .layout-wrapper { flex-direction: row; gap: 40px; } }
    .sidebar { width: 100%; display: flex; flex-direction: row; overflow-x: auto; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
    @media(min-width: 800px) { .sidebar { width: 250px; flex-direction: column; border-bottom: none; border-right: 1px solid var(--border-color); padding-right: 20px; flex-shrink: 0; } }
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 8px; color: var(--text-muted); font-weight: 600; transition: all 0.2s; white-space: nowrap; }
    .nav-item:hover { background: #e2e8f0; color: var(--text-main); }
    .nav-item.active { background: var(--primary); color: white; }
    .nav-item svg { width: 18px; height: 18px; }
    
    .main-content { flex: 1; min-width: 0; }
    .card { background: var(--bg-white); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); margin-bottom: 24px; }
    .card-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    .card-subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; }
    
    /* NEW STATS UI */
    .total-stat { background: linear-gradient(135deg, #eef2ff, #e0e7ff); padding: 30px; border-radius: 12px; text-align: center; margin-bottom: 30px; border: 1px solid #c7d2fe; }
    .total-stat h2 { font-size: 3rem; font-weight: 800; color: var(--primary); line-height: 1; margin-bottom: 10px; }
    .total-stat p { font-size: 0.9rem; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }
    
    .key-row { display: flex; justify-content: space-between; align-items: center; padding: 16px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 12px; background: white; }
    .key-row h4 { font-size: 1rem; color: var(--text-main); margin-bottom: 4px; }
    .key-row code { background: var(--bg-main); padding: 4px 8px; border-radius: 4px; font-size: 0.8rem; color: var(--text-muted); border: 1px solid var(--border-color); }
    .key-count { font-size: 1.2rem; font-weight: 800; color: var(--primary); white-space: nowrap; }
    .key-count span { font-size: 0.8rem; font-weight: 500; color: var(--text-muted); }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); background: var(--bg-main); border-radius: 12px; border: 1px dashed var(--border-color); }
  </style>
</head>
<body>
  <header class="header">
    <div class="nav-container">
      <a href="index.html" class="logo"><div class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></div>NG Locations</a>
      <div style="display: flex; align-items: center; gap: 10px; font-weight: 600;">
        <div style="width: 32px; height: 32px; background: #e0e7ff; color: var(--primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; text-transform: uppercase;" id="header-avatar">U</div>
        <span id="header-name">Loading...</span>
      </div>
    </div>
  </header>

  <div class="layout-wrapper">
    <aside class="sidebar">
      <a href="dashboard.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>Overview</a>
      <a href="keys.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>API Keys</a>
      <a href="usage.html" class="nav-item active"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>Usage</a>
      <a href="profile.html" class="nav-item"><svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>Profile</a>
    </aside>

    <main class="main-content">
      <div class="card">
        <h2 class="card-title">API Usage</h2>
        <p class="card-subtitle">Monitor your API request volume.</p>
        
        <!-- Total Requests -->
        <div class="total-stat">
          <h2 id="total-requests">0</h2>
          <p>Total Requests</p>
        </div>

        <!-- Breakdown by Key -->
        <h3 style="font-size: 1.1rem; margin-bottom: 15px;">Usage Breakdown by Key</h3>
        <div id="keys-list">
          <div class="empty-state">Loading usage data...</div>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // Initialize Supabase
      const supabase = window.supabase.createClient('https://grniwunynpmakpilhryh.supabase.co', 'sb_publishable_ahGy4oAWBhqZ0ux4EabSfg_FAqwlDul');
      
      // Auth Guard
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) { window.location.href = 'auth.html'; return; }

      // Set User Info
      const username = session.user.user_metadata?.username || session.user.email.split('@')[0];
      document.getElementById('header-name').textContent = username;
      document.getElementById('header-avatar').textContent = username.charAt(0);

      // Fetch Data
      const { data: keys, error } = await supabase
        .from('api_keys')
        .select('name, key_prefix, request_count, revoked')
        .order('request_count', { ascending: false });

      const listEl = document.getElementById('keys-list');
      const totalEl = document.getElementById('total-requests');

      if (error) {
        listEl.innerHTML = `<div class="empty-state" style="color: red;">Error loading data: ${error.message}</div>`;
        return;
      }

      if (keys.length === 0) {
        listEl.innerHTML = `<div class="empty-state">You haven't generated any API keys yet.</div>`;
        return;
      }

      let totalRequests = 0;

      // Build the HTML for each key
      const html = keys.map(key => {
        const count = key.request_count || 0;
        totalRequests += count;
        
        return `
          <div class="key-row">
            <div>
              <h4>${key.name} ${key.revoked ? '<span style="color:#dc2626; font-size:0.75rem;">(Revoked)</span>' : ''}</h4>
              <code>${key.key_prefix}••••••••</code>
            </div>
            <div class="key-count">${count.toLocaleString()} <span>reqs</span></div>
          </div>
        `;
      }).join('');

      listEl.innerHTML = html;
      totalEl.textContent = totalRequests.toLocaleString();
    });
  </script>
</body>
</html>
