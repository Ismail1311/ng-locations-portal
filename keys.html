<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Keys - NG Locations API</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-main: #f8fafc; --bg-white: #ffffff;
      --text-main: #0f172a; --text-muted: #475569;
      --primary: #4f46e5; --primary-hover: #4338ca;
      --border-color: #e2e8f0;
      --danger: #dc2626; --danger-bg: #fef2f2; --danger-border: #fecaca;
      --success: #16a34a; --success-bg: #f0fdf4; --success-border: #bbf7d0;
      --warning: #ca8a04; --warning-bg: #fefce8; --warning-border: #fef08a;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-main); color: var(--text-main); }
    a { text-decoration: none; color: inherit; }
    
    /* HEADER & LAYOUT */
    .header { background: var(--bg-white); border-bottom: 1px solid var(--border-color); position: sticky; top: 0; z-index: 50; }
    .nav-container { max-width: 1200px; margin: 0 auto; padding: 0 20px; height: 70px; display: flex; justify-content: space-between; align-items: center; }
    .logo { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.25rem; color: var(--text-main); }
    .logo-icon { background: var(--primary); color: white; padding: 6px; border-radius: 8px; display: flex; }
    
    .layout-wrapper { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 20px; }
    @media(min-width: 800px) { .layout-wrapper { flex-direction: row; gap: 40px; } }

    /* SIDEBAR */
    .sidebar { width: 100%; display: flex; flex-direction: row; overflow-x: auto; gap: 10px; padding-bottom: 10px; border-bottom: 1px solid var(--border-color); }
    @media(min-width: 800px) { .sidebar { width: 250px; flex-direction: column; border-bottom: none; border-right: 1px solid var(--border-color); padding-right: 20px; flex-shrink: 0; } }
    
    .nav-item { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 8px; color: var(--text-muted); font-weight: 600; transition: all 0.2s; white-space: nowrap; }
    .nav-item:hover { background: #e2e8f0; color: var(--text-main); }
    .nav-item.active { background: var(--primary); color: white; }
    .nav-item svg { width: 18px; height: 18px; }

    /* MAIN CONTENT */
    .main-content { flex: 1; min-width: 0; }
    .card { background: var(--bg-white); border: 1px solid var(--border-color); border-radius: 16px; padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.02); margin-bottom: 24px; }
    .card-title { font-size: 1.25rem; font-weight: 700; margin-bottom: 8px; }
    .card-subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 20px; }

    /* FORMS & BUTTONS */
    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; font-family: inherit; font-size: 0.95rem; outline: none; transition: border 0.2s; }
    input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
    .btn { background: var(--primary); color: white; border: none; padding: 12px 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; display: inline-flex; justify-content: center; align-items: center; gap: 8px; font-size: 0.95rem;}
    .btn:hover { background: var(--primary-hover); }
    .btn:disabled { opacity: 0.7; cursor: not-allowed; }

    /* NEW KEY REVEAL BOX */
    .new-key-box { background: var(--warning-bg); border: 1px solid var(--warning-border); border-radius: 12px; padding: 20px; margin-bottom: 24px; display: none; animation: fadeIn 0.3s ease; }
    .new-key-box h4 { color: var(--warning); font-size: 0.95rem; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
    .key-display { display: flex; gap: 10px; }
    .key-display input { background: white; font-family: 'Fira Code', monospace; font-size: 0.9rem; border-color: var(--warning-border); font-weight: 600; color: var(--text-main); }
    .btn-copy { background: var(--warning); color: white; border: none; padding: 0 16px; border-radius: 8px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: background 0.2s; }
    .btn-copy:hover { background: #a16207; }

    /* KEY LIST */
    .key-list { display: flex; flex-direction: column; gap: 12px; }
    .key-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; border: 1px solid var(--border-color); border-radius: 12px; transition: all 0.2s; }
    .key-item:hover { border-color: #cbd5e1; }
    .key-info h4 { font-size: 1rem; color: var(--text-main); margin-bottom: 4px; }
    .key-prefix { font-family: 'Fira Code', monospace; background: var(--bg-main); padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; color: var(--text-muted); border: 1px solid var(--border-color); display: inline-block; }
    .key-meta { font-size: 0.8rem; color: #94a3b8; margin-top: 8px; }
    
    .status-badge { font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; }
    .status-active { background: var(--success-bg); color: var(--success); border: 1px solid var(--success-border); }
    .status-revoked { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); }
    
    .btn-revoke { background: transparent; color: var(--danger); border: 1px solid var(--danger-border); padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .btn-revoke:hover { background: var(--danger-bg); }

    .alert { padding: 12px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 20px; display: none; text-align: center; font-weight: 500; }
    .alert.error { background: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger-border); display: block; }
    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); background: var(--bg-main); border-radius: 12px; border: 1px dashed var(--border-color); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>

  <header class="header">
    <div class="nav-container">
      <a href="index.html" class="logo">
        <div class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></div>
        NG Locations
      </a>
      <div style="display: flex; align-items: center; gap: 10px; font-weight: 600;">
        <div style="width: 32px; height: 32px; background: #e0e7ff; color: var(--primary); border-radius: 50%; display: flex; justify-content: center; align-items: center; text-transform: uppercase;" id="user-avatar">U</div>
        <span id="user-name">Loading...</span>
      </div>
    </div>
  </header>

  <div class="layout-wrapper">
    <aside class="sidebar">
      <a href="dashboard.html" class="nav-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
        Overview
      </a>
      <a href="keys.html" class="nav-item active">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" /></svg>
        API Keys
      </a>
      <a href="usage.html" class="nav-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" /></svg>
        Usage
      </a>
      <a href="profile.html" class="nav-item">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
        Profile
      </a>
    </aside>

    <main class="main-content">
      
      <!-- ONE-TIME REVEAL BOX -->
      <div id="new-key-box" class="new-key-box">
        <h4>
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" x2="12" y1="9" y2="13"/><line x1="12" x2="12.01" y1="17" y2="17"/></svg>
          Copy your API key now. You won't see it again!
        </h4>
        <div class="key-display">
          <input type="text" id="new-key-value" readonly>
          <button class="btn-copy" onclick="copyKey()">Copy</button>
        </div>
      </div>

      <!-- GENERATE KEY FORM -->
      <div class="card">
        <h2 class="card-title">Create a New API Key</h2>
        <p class="card-subtitle">Generate a new key to authenticate requests to the NG Locations API.</p>
        <div id="create-alert" class="alert"></div>
        <form id="form-create-key" style="display: flex; gap: 10px; align-items: flex-start;">
          <div class="input-group" style="flex: 1; margin-bottom: 0;">
            <input type="text" id="key-name" required placeholder="e.g. My E-commerce App" maxlength="50">
          </div>
          <button type="submit" class="btn" id="btn-create">
            <span class="btn-text">Generate Key</span>
          </button>
        </form>
      </div>

      <!-- LIST OF KEYS -->
      <div class="card">
        <h2 class="card-title">Your API Keys</h2>
        <p class="card-subtitle">Manage your active and revoked keys. Keep these secret!</p>
        <div id="keys-list" class="key-list">
          <div class="empty-state">Loading your keys...</div>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // 1. INIT SUPABASE & AUTH GUARD
      const supabase = window.supabase.createClient('https://grniwunynpmakpilhryh.supabase.co', 'sb_publishable_ahGy4oAWBhqZ0ux4EabSfg_FAqwlDul');
      const { data: { session } } = await supabase.auth.getSession();
      
      if (!session) { window.location.href = 'auth.html'; return; }

      // Set user details in header
      const username = session.user.user_metadata?.username || session.user.email.split('@')[0];
      document.getElementById('user-name').textContent = username;
      document.getElementById('user-avatar').textContent = username.charAt(0);

      // 2. LOAD KEYS
      async function loadKeys() {
        const listEl = document.getElementById('keys-list');
        listEl.innerHTML = '<div class="empty-state">Loading...</div>';
        
        const { data: keys, error } = await supabase
          .from('api_keys')
          .select('*')
          .order('created_at', { ascending: false });

        if (error) {
          listEl.innerHTML = `<div class="alert error">Failed to load keys: ${error.message}</div>`;
          return;
        }

        if (keys.length === 0) {
          listEl.innerHTML = `<div class="empty-state">No API keys yet. Generate one above to get started.</div>`;
          return;
        }

        listEl.innerHTML = keys.map(key => {
          const createdDate = new Date(key.created_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
          return `
            <div class="key-item">
              <div class="key-info">
                <h4>${key.name}</h4>
                <div class="key-prefix">${key.key_prefix}••••••••</div>
                <div class="key-meta">Created: ${createdDate}</div>
              </div>
              <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 8px;">
                <span class="status-badge ${key.revoked ? 'status-revoked' : 'status-active'}">
                  ${key.revoked ? 'Revoked' : 'Active'}
                </span>
                ${!key.revoked ? `<button class="btn-revoke" onclick="revokeKey('${key.id}')">Revoke</button>` : ''}
              </div>
            </div>
          `;
        }).join('');
      }

      // 3. GENERATE KEY (Calls the Postgres function)
      document.getElementById('form-create-key').addEventListener('submit', async (e) => {
        e.preventDefault();
        const nameInput = document.getElementById('key-name');
        const btn = document.getElementById('btn-create');
        const keyName = nameInput.value.trim();
        
        if (!keyName) return;

        btn.disabled = true;
        btn.querySelector('.btn-text').textContent = 'Generating...';
        document.getElementById('new-key-box').style.display = 'none';
        document.getElementById('create-alert').className = 'alert';

        // The magic line calling our Supabase function
        const { data: rawKey, error } = await supabase.rpc('generate_api_key', {
          key_name: keyName
        });

        btn.disabled = false;
        btn.querySelector('.btn-text').textContent = 'Generate Key';

        if (error) {
          const alertEl = document.getElementById('create-alert');
          alertEl.textContent = error.message;
          alertEl.className = 'alert error';
          return;
        }

        // Show the raw key ONE TIME
        nameInput.value = '';
        document.getElementById('new-key-value').value = rawKey;
        document.getElementById('new-key-box').style.display = 'block';
        
        // Reload list
        await loadKeys();
      });

      // 4. REVOKE KEY
      window.revokeKey = async (keyId) => {
        if (!confirm('Are you sure? Apps using this key will stop working immediately.')) return;
        const { error } = await supabase.from('api_keys').update({ revoked: true }).eq('id', keyId);
        if (!error) await loadKeys();
      };

      // 5. COPY TO CLIPBOARD
      window.copyKey = () => {
        const keyInput = document.getElementById('new-key-value');
        keyInput.select();
        navigator.clipboard.writeText(keyInput.value);
        const btn = document.querySelector('.btn-copy');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 2000);
      };

      // Initialize
      await loadKeys();
    });
  </script>
</body>
</html>
