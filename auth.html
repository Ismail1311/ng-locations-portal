<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - NG Locations API</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg-surface: #f8fafc; --text-main: #0f172a; --text-muted: #475569; --primary: #4f46e5; --primary-hover: #4338ca; --border-color: #e2e8f0; --error: #dc2626; --success: #16a34a; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background-color: var(--bg-surface); color: var(--text-main); display: flex; flex-direction: column; min-height: 100vh; background-image: radial-gradient(circle at top, rgba(79, 70, 229, 0.08), transparent 40%); }
    a { text-decoration: none; color: var(--primary); font-weight: 600; cursor: pointer; }
    .header { padding: 20px; display: flex; justify-content: center; }
    .logo { display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 1.25rem; color: var(--text-main); }
    .logo-icon { background: var(--primary); color: white; padding: 6px; border-radius: 8px; display: flex; }
    .main-content { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .auth-card { background: white; width: 100%; max-width: 420px; padding: 40px; border-radius: 20px; box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05); border: 1px solid var(--border-color); }
    .view { display: none; animation: fadeIn 0.3s ease; }
    .view.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .auth-title { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; text-align: center; }
    .auth-subtitle { font-size: 0.9rem; color: var(--text-muted); text-align: center; margin-bottom: 30px; }
    .input-group { margin-bottom: 20px; position: relative; }
    .input-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; }
    .input-wrapper { position: relative; display: flex; align-items: center; }
    .input-icon { position: absolute; left: 14px; color: #94a3b8; }
    input { width: 100%; padding: 12px 14px 12px 42px; border: 1px solid var(--border-color); border-radius: 10px; font-size: 0.95rem; outline: none; background: var(--bg-surface); transition: all 0.2s; }
    input:focus { border-color: var(--primary); background: white; box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
    .toggle-password { position: absolute; right: 14px; color: #94a3b8; cursor: pointer; background: none; border: none; display: flex; }
    .btn { width: 100%; padding: 12px; border-radius: 10px; border: none; background: var(--primary); color: white; font-weight: 600; cursor: pointer; transition: all 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
    .btn:hover { background: var(--primary-hover); }
    .forgot-link { display: block; text-align: right; font-size: 0.85rem; margin-top: -10px; margin-bottom: 20px; }
    .alert { padding: 12px; border-radius: 8px; font-size: 0.9rem; margin-bottom: 20px; display: none; text-align: center; font-weight: 500; }
    .alert.error { background: #fef2f2; color: var(--error); border: 1px solid #fecaca; display: block; }
    .alert.success { background: #f0fdf4; color: var(--success); border: 1px solid #bbf7d0; display: block; }
    .auth-footer { text-align: center; margin-top: 25px; font-size: 0.9rem; color: var(--text-muted); }
  </style>
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">
      <div class="logo-icon"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg></div>
      NG Locations
    </a>
  </header>

  <main class="main-content">
    <div class="auth-card">
      <!-- SIGN IN -->
      <div id="view-signin" class="view active">
        <h2 class="auth-title">Welcome back</h2>
        <p class="auth-subtitle">Sign in to manage your API keys</p>
        <div id="signin-alert" class="alert"></div>
        <form id="form-signin">
          <div class="input-group">
            <label>Email address</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              <input type="email" id="signin-email" required placeholder="developer@example.com">
            </div>
          </div>
          <div class="input-group">
            <label>Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="signin-password" required placeholder="••••••••">
              <button type="button" class="toggle-password" data-target="signin-password"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <a class="forgot-link" id="link-forgot">Forgot password?</a>
          <button type="submit" class="btn" id="btn-signin"><span class="btn-text">Sign In</span></button>
        </form>
        <div class="auth-footer">Don't have an account? <a id="link-signup">Sign up</a></div>
      </div>

      <!-- SIGN UP -->
      <div id="view-signup" class="view">
        <h2 class="auth-title">Create an account</h2>
        <p class="auth-subtitle">Get your free API keys instantly</p>
        <div id="signup-alert" class="alert"></div>
        <form id="form-signup">
          <div class="input-group">
            <label>Username</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="signup-username" required placeholder="johndoe123" minlength="3" maxlength="20">
            </div>
          </div>
          <div class="input-group">
            <label>Email address</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              <input type="email" id="signup-email" required placeholder="developer@example.com">
            </div>
          </div>
          <div class="input-group">
            <label>Password</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
              <input type="password" id="signup-password" required placeholder="Min. 6 characters" minlength="6">
              <button type="button" class="toggle-password" data-target="signup-password"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg></button>
            </div>
          </div>
          <button type="submit" class="btn" id="btn-signup"><span class="btn-text">Create Account</span></button>
        </form>
        <div class="auth-footer">Already have an account? <a id="link-signin">Sign in</a></div>
      </div>

      <!-- FORGOT PASSWORD -->
      <div id="view-forgot" class="view">
        <h2 class="auth-title">Reset password</h2>
        <p class="auth-subtitle">We'll send you a link to reset your password.</p>
        <div id="forgot-alert" class="alert"></div>
        <form id="form-forgot">
          <div class="input-group">
            <label>Email address</label>
            <div class="input-wrapper">
              <svg class="input-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
              <input type="email" id="forgot-email" required placeholder="developer@example.com">
            </div>
          </div>
          <button type="submit" class="btn" id="btn-forgot"><span class="btn-text">Send Reset Link</span></button>
        </form>
        <div class="auth-footer">Remembered it? <a id="link-back-signin">Back to Sign in</a></div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const supabase = window.supabase.createClient('https://grniwunynpmakpilhryh.supabase.co', 'sb_publishable_ahGy4oAWBhqZ0ux4EabSfg_FAqwlDul');

      function switchView(viewName) {
        document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
        document.getElementById(`view-${viewName}`).classList.add('active');
        document.querySelectorAll('.alert').forEach(el => { el.className = 'alert'; el.textContent = ''; });
      }

      document.querySelectorAll('.toggle-password').forEach(btn => {
        btn.addEventListener('click', function() {
          const input = document.getElementById(this.getAttribute('data-target'));
          input.type = input.type === 'password' ? 'text' : 'password';
        });
      });

      document.getElementById('link-forgot').addEventListener('click', (e) => { e.preventDefault(); switchView('forgot'); });
      document.getElementById('link-signup').addEventListener('click', (e) => { e.preventDefault(); switchView('signup'); });
      document.getElementById('link-signin').addEventListener('click', (e) => { e.preventDefault(); switchView('signin'); });
      document.getElementById('link-back-signin').addEventListener('click', (e) => { e.preventDefault(); switchView('signin'); });

      function showAlert(view, msg, type = 'error') {
        const el = document.getElementById(`${view}-alert`);
        el.textContent = msg; el.className = `alert ${type}`;
      }

      document.getElementById('form-signin').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-signin');
        btn.disabled = true; btn.querySelector('.btn-text').textContent = 'Signing in...';
        const { error } = await supabase.auth.signInWithPassword({ email: document.getElementById('signin-email').value, password: document.getElementById('signin-password').value });
        if (error) { showAlert('signin', error.message); btn.disabled = false; btn.querySelector('.btn-text').textContent = 'Sign In'; } 
        else { window.location.href = 'dashboard.html'; }
      });

      document.getElementById('form-signup').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('btn-signup');
        btn.disabled = true; btn.querySelector('.btn-text').textContent = 'Creating...';
        
        const username = document.getElementById('signup-username').value;
        const email = document.getElementById('signup-email').value;
        const password = document.getElementById('signup-password').value;

        const { data, error } = await supabase.auth.signUp({ 
          email, 
          password,
          options: {
            data: { username: username } // Save username to user_metadata
          }
        });
        
        if (error) { 
          showAlert('signup', error.message); 
          btn.disabled = false; btn.querySelector('.btn-text').textContent = 'Create Account'; 
        } else {
          if (data.session) { window.location.href = 'dashboard.html'; } 
          else { 
            showAlert('signup', 'Account created! Check your email for a confirmation link.', 'success'); 
            btn.disabled = false; btn.querySelector('.btn-text').textContent = 'Create Account';
          }
        }
      });
    });
  </script>
</body>
</html>
